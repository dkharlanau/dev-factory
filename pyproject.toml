[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "devfactory-local"
version = "0.1.0"
description = "Bounded local development control using the official Codex runtime"
requires-python = ">=3.11"
dependencies = ["openai-codex==0.157.1"]

[project.scripts]
factory = "devfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devfactory = ["defaults.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
