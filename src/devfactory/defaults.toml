policy_version = "3.2"

[budget]
deadline_seconds = 1800
max_turns = 6
max_queue_turns = 60
soft_tokens = 500000
finish_started_task = true
repair_rounds = 2
escalations = 1
allowance_reserve_percent = 10
quota_bucket = "codex"
unknown_quota = "pause"

[context]
native_autocompaction = true
factory_auto_compaction = true
compact_after_builder_turns = 2
compact_min_remaining_tokens = 100000
navigation_files = 40
failure_log_bytes = 12000
cold_paths = ["archive/", "docs/archive/", "docs/benchmarks/", "docs/receipts/", ".factory/", "coverage/", "dist/", "build/"]

[batching]
enabled = true
max_tasks = 4
max_paths = 24
max_checks = 6
max_packet_bytes = 12000

[hygiene]
history_commits = 200
max_roots_per_commit = 8
min_cochange_commits = 2
min_cochange_confidence = 0.35
large_file_bytes = 1000000
wide_directory_entries = 500
root_entries = 40
instruction_max_lines = 120
instruction_max_bytes = 12000

[integration]
push = false
pull_request = false
merge = false
deploy = false

[sandbox]
# Network access is off by default and can be granted per project by the owner.
network_access = false

# Quality-first routing with a live-catalog fallback ladder.
# Model availability is verified at runtime; quota exhaustion never triggers switching.
[profiles.fast]
models = ["gpt-6-luna", "gpt-6-sol", "native"]
effort = "low"
[profiles.standard]
models = ["gpt-6-sol", "gpt-6-astra", "native"]
effort = "medium"
[profiles.deep]
models = ["gpt-6-astra", "gpt-6-sol", "native"]
effort = "high"
[profiles.review_fast]
models = ["gpt-6-luna", "gpt-6-sol", "native"]
effort = "low"
[profiles.review]
models = ["gpt-6-sol", "gpt-6-astra", "native"]
effort = "medium"

[projects.vedokrok]
repository = "dkharlanau/vedokrok"
instructions = ["AGENTS.md", "CHATGPT.md", "CONTRIBUTING.md"]
backlogs = ["CHATGPT.md", "BACKLOG.md", "docs/CURRENT_LOOP.md"]
boundary = "Public website; MHC authoring data is never publication authority."
allowed_modes = ["plan", "worktree"]
high_risk_paths = ["worker/", "schema/", "migrations/", "agent-plugin/"]

[projects.ptichi-site]
repository = "dkharlanau/ptichi-site"
instructions = ["AGENTS.md", "docs/CURRENT_LOOP.md"]
backlogs = ["docs/CURRENT_LOOP.md"]
boundary = "Website only. Do not invent recorder, installer, microphone or desktop availability."
allowed_modes = ["plan", "worktree"]
high_risk_paths = ["data/product-release.json", "data/site-purpose.json"]

[projects.voice-lab]
repository = "dkharlanau/voice-lab"
instructions = ["AGENTS.md", "REPO_MAP.md", "docs/CURRENT_PRODUCT_LOOP.md"]
backlogs = ["docs/CURRENT_PRODUCT_LOOP.md", "BACKLOG.md"]
boundary = "Desktop/runtime; fixtures do not prove microphone, OS, user or listener evidence."
allowed_modes = ["plan", "worktree"]
high_risk_paths = ["crates/", "release/", "packages/contracts/", "src-tauri/"]
